name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Unit tests only need the light dependencies; the data scripts are not run in CI.
      - run: pip install numpy scipy networkx pyyaml pyproj pytest
      - run: pip install -e . --no-deps
      - run: pytest -q
